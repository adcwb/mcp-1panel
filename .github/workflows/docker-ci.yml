name: Docker CI

on:
  push:
    branches: [dev-v2, main, master]
  pull_request:
    branches: [dev-v2, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE || 'adcwb/mcp-1panel' }}
  TEST_IMAGE: mcp-1panel:ci
  CI_VERSION: v0.0.0-ci.${{ github.sha }}

jobs:
  docker:
    name: Test, build and publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify contracts and test
        run: |
          make check_api
          go test ./...
          go vet ./...
          make docker_test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.version=${{ env.CI_VERSION }}

      - name: Build image for runtime tests
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.CI_VERSION }}
          cache-from: type=gha,scope=docker-ci
          cache-to: type=local,dest=${{ runner.temp }}/docker-test-cache,mode=max

      - name: Verify the image exposes all 790 tools by default
        env:
          MCP_DOCKER_TEST_IMAGE: ${{ env.TEST_IMAGE }}
        run: go test . -run '^TestDockerImageToolAccess$' -count=1 -v -timeout 2m

      - name: Check Docker Hub credentials
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets."
            exit 1
          fi

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A fresh builder has no cache mounts. The arm64 compile must work using
      # only exported layers, catching missing offline Go dependencies.
      - name: Set up fresh builder to verify exported cache
        id: publish-builder
        uses: docker/setup-buildx-action@v4

      # PRs build both platforms without credentials or publishing. Branch and
      # manual runs publish only after the default-command runtime test passes.
      - name: Build multi-platform image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.publish-builder.outputs.name }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.CI_VERSION }}
          cache-from: |
            type=local,src=${{ runner.temp }}/docker-test-cache
            type=gha,scope=docker-ci
          cache-to: type=gha,scope=docker-ci,mode=max
